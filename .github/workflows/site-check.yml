# Checks the website on every change to main, and on every pull request that touches it:
# tools/site_check.js opens every page in a real browser (script errors, phone width, image
# descriptions, links, every chart tab). If it finds a problem the check fails, and the pull request
# shows why. (The constructions themselves are checked by verify.yml.)
name: Site check

on:
  push:
    branches: [main]
  pull_request:
    paths: ['index.html', 'pages/**', 'tools/**', 'Approximations/**', 'Architecture/**', 'Wanted/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the browser
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Check every page
        run: node tools/site_check.js
