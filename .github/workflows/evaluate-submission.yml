# Evaluates every submission pull request (files under Submissions/, usually sent by the browser
# extension in extension/) and posts the result as a comment, with labels.
#
# Safety: pull_request_target runs with this repository's permissions, so it must never run code
# from the pull request. It checks out THIS repository's own branch for the scripts, and fetches
# the submitted files only as data, which tools/evaluate_submission.py reads but never runs.
name: Evaluate submission

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ['Submissions/**']

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: evaluate-submission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4          # the repository's own scripts, not the pull request's
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mpmath

      - name: Fetch the submitted files as data
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "pull/$PR/head:submission"
          # the files this pull request changes, as GitHub lists them (unaffected by later changes to main)
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > changed.txt
          # Only files inside one Submissions/<folder>/ may be added.
          grep -v '^Submissions/' changed.txt > outside.txt || true
          dirs=$(grep '^Submissions/' changed.txt | cut -d/ -f1-2 | sort -u)
          echo "$dirs" > dirs.txt
          mkdir -p sub
          if [ "$(grep -c . dirs.txt)" = "1" ]; then
            for f in construction.ggb submission.json submission.md; do
              git show "submission:$(cat dirs.txt)/$f" > "sub/$f" 2>/dev/null || rm -f "sub/$f"
            done
          fi

      - name: Evaluate
        run: |
          mkdir -p out
          if [ -s outside.txt ] || [ "$(grep -c . dirs.txt)" != "1" ]; then
            printf '## Submission evaluation\n\nA submission should add one folder under Submissions/ and change nothing else. This pull request changes:\n\n%s\n\nIt needs checking by hand.\n' "$(sed 's/^/- /' changed.txt)" > out/report.md
            printf 'submission\nneeds-manual-check\n' > out/labels.txt; echo manual > out/decision.txt
          else
            python tools/evaluate_submission.py sub --out out || { printf 'The evaluation could not finish. It needs checking by hand.\n' > out/report.md; printf 'submission\nneeds-manual-check\n' > out/labels.txt; echo manual > out/decision.txt; }
          fi

      - name: Comment, label, and close if needed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request, number = pr.number;
            const {owner, repo} = context.repo;
            const close = async (body, labels) => {
              await github.rest.issues.createComment({owner, repo, issue_number: number, body: body + '\n\n---\n_Generated by the archive\'s evaluation workflow._'});
              await github.rest.issues.addLabels({owner, repo, issue_number: number, labels});
              await github.rest.pulls.update({owner, repo, pull_number: number, state: 'closed'});
            };
            // The other open submissions, oldest first.
            const open = (await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', per_page: 100}))
              .filter(p => p.number !== number && (p.head.ref.startsWith('submission-') || p.labels.some(l => l.name === 'submission')));
            const ggbOf = async n => {
              const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: n, per_page: 100});
              const f = files.find(f => f.filename.endsWith('/construction.ggb')); return f && f.sha;
            };

            // 1. The very same construction file as an earlier open submission (a double click, say): close it as a duplicate.
            const mine = await ggbOf(number);
            for (const p of open.filter(p => p.number < number).sort((a, b) => a.number - b.number)) {
              if (mine && await ggbOf(p.number) === mine) {
                return close(`## Duplicate\n\nThis is the same construction file as #${p.number}, which is already waiting for review, so this copy has been closed. Nothing is lost: #${p.number} carries it.`, ['submission', 'duplicate-submission']);
              }
            }

            // 2. Too many open submissions from one person at once (the maintainer and collaborators are not limited).
            const LIMIT = 5;
            const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association);
            const theirs = open.filter(p => p.user.login === pr.user.login && p.number < number);   // earlier ones: the first few always stay
            if (!trusted && theirs.length >= LIMIT) {
              return close(`## Waiting for review\n\nYou already have ${theirs.length} submissions waiting for review, which is the most that can wait at once. Thank you for all of them! This one has been closed so the maintainer can catch up; please send it again once some of the others have been reviewed.`, ['submission', 'limit-reached']);
            }

            // 3. The evaluation itself.
            const body = fs.readFileSync('out/report.md', 'utf8') + '\n\n---\n_Generated by the archive\'s evaluation workflow._';
            const labels = fs.readFileSync('out/labels.txt', 'utf8').split('\n').map(s => s.trim()).filter(Boolean);
            const decision = fs.readFileSync('out/decision.txt', 'utf8').trim();
            await github.rest.issues.createComment({owner, repo, issue_number: number, body});
            const stale = ['ready-for-review', 'needs-manual-check', 'below-minimum', 'possible-duplicate', 'language'];
            for (const name of stale) if (!labels.includes(name)) await github.rest.issues.removeLabel({owner, repo, issue_number: number, name}).catch(() => {});
            await github.rest.issues.addLabels({owner, repo, issue_number: number, labels});
            if (decision === 'reject' || decision === 'language') await github.rest.pulls.update({owner, repo, pull_number: number, state: 'closed'});
