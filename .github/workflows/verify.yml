# Rebuilds every GeoGebra construction and checks it against the charts (tools/verify.py)
# whenever the charts, the constructions or the checker change.
name: Verify constructions

on:
  push:
    paths: ['Approximations/**', 'pages/archive-data.js', 'tools/verify.py']
  pull_request:
    paths: ['Approximations/**', 'pages/archive-data.js', 'tools/verify.py']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and check every construction
        # Some entries do not reproduce yet (see the verification page). Once they are resolved,
        # delete the next line so any new disagreement fails the check.
        continue-on-error: true
        run: python tools/verify.py
