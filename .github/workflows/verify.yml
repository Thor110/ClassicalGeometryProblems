# Rebuilds every GeoGebra construction and checks it against the charts (tools/verify.py)
# whenever the charts, the constructions or the checker change.
name: Verify constructions

on:
  push:
    paths: ['Approximations/**', 'pages/archive-data.js', 'tools/*.py']
  pull_request:
    paths: ['Approximations/**', 'pages/archive-data.js', 'tools/*.py']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mpmath
      - name: Rebuild and check every construction
        # Entries the maintainer has already looked at carry known_issue in pages/archive-data.js and are
        # listed without failing; any new disagreement fails the check.
        run: python tools/verify.py
      - name: Check every chart figure against the label rule
        # At most ten decimal places, a truncation of the precise readout, and in order on each side (SUBMISSION_RULESET.md).
        run: python tools/add_submission.py --check-labels
